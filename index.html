<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;

  --border:#e4e7ec;

  --dark-2:#161d31;

  --green-border:#bfe7d8;

  --orange-bg:#fff6ed;

*{

}

html{

}

body{

}

a{

  text-decoration:none;
}

button,
input,
select{

}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:
    radial-gradient(circle at 50% -80%,rgba(83,130,255,.25),transparent 45%),

  color:#d0d5dd;
  text-align:center;
  padding:9px 16px;
  font-size:13px;
  font-weight:500;
  letter-spacing:.01em;
}

/* =========================

========================= */

}

.nav{

}

  font-weight:800;

}

.brand-mark{

}

.nav-cta:hover{

  box-shadow:0 12px 24px rgba(11,16,32,.2);
}

}

.hero h1 strong{

.hero p{

  margin:0;
  color:#667085;
  font-size:18px;

}

.hero-actions{

  font-weight:800;
  transition:.22s ease;
}

.btn-primary{
  color:#fff;
  background:linear-gradient(135deg,#175cd3,#315fd5);
  box-shadow:
    0 10px 24px rgba(23,92,211,.24),
    inset 0 1px 0 rgba(255,255,255,.2);
}

.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:

    inset 0 1px 0 rgba(255,255,255,.2);
}

.btn-secondary{
  color:#344054;
  background:rgba(255,255,255,.8);
  border-color:#d0d5dd;
  box-shadow:0 5px 15px rgba(16,24,40,.04);
}

.btn-secondary:hover{
  transform:translateY(-2px);
  background:#fff;
  border-color:#98a2b3;
}

.hero-note{

  font-size:12px !important;
  color:#98a2b3 !important;
}

.proof-row{

  flex-wrap:wrap;
  gap:8px;
  margin-top:24px;
}

.proof-chip{

  border:1px solid #e4e7ec;
  border-radius:999px;
  background:rgba(255,255,255,.75);
  color:#475467;
  font-size:12px;
  font-weight:700;
}

========================= */

}

.calculate-btn{

  box-shadow:0 12px 25px rgba(23,92,211,.22);
  transition:.22s ease;
}

.calculate-btn:hover{

  box-shadow:0 16px 32px rgba(23,92,211,.28);
}

/* =========================
   GENERAL SECTIONS
========================= */

section{

}

.container{
  width:min(1180px,calc(100% - 40px));

}

  text-align:center;
}

.section-heading h2{

}

}

========================= */

.features-grid,

  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.card,
.audience-card,
.feature-card,
.step-card{
  background:rgba(255,255,255,.88);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  box-shadow:0 8px 24px rgba(16,24,40,.045);
  transition:.25s ease;
}

.card:hover,
.audience-card:hover,
.feature-card:hover,
.step-card:hover{

  border-color:#c7d2e4;
  box-shadow:0 18px 40px rgba(16,24,40,.09);
}

   PRO SECTION
========================= */

.pro-section{
  position:relative;
  overflow:hidden;
  color:#fff;
  background:

}

}

.pro-section .feature-card:hover{

}

   PRICING
========================= */

.pricing-grid{

  grid-template-columns:repeat(2,minmax(0,1fr));

  margin:auto;
}

  padding:30px;

  border-radius:24px;
  background:#fff;
  box-shadow:var(--shadow);
}

.price-card.featured{
  border:2px solid #175cd3;
  box-shadow:

    0 8px 20px rgba(16,24,40,.05);
}

.price-card.featured::before{
  content:"PLANNED";
  position:absolute;
  top:-12px;
  right:22px;
  padding:5px 9px;
  border-radius:999px;
  background:#175cd3;
  color:#fff;
  font-size:10px;
  font-weight:850;

}

/* =========================
   FAQ
========================= */

.faq{

}

========================= */

}

.final-cta h2{
  margin:0 auto 12px;
  max-width:700px;
  font-size:clamp(36px,5vw,56px);
  line-height:1.05;
  letter-spacing:-.05em;
}

.final-cta p{
  max-width:600px;
  margin:0 auto;
  color:var(--muted);
}

/* =========================
   FOOTER
========================= */

footer{
  padding:38px 0;
  color:#98a2b3;
  background:#0b1020;
  font-size:13px;
}

========================= */
